# Security headers for the whole site.
# CSP is scoped to what the site actually loads:
#  - Google Fonts (fonts.googleapis.com / fonts.gstatic.com)
#  - contact form POSTs (fetch) to Web3Forms and FormSubmit
# If the contact form ever moves to a new provider, update connect-src/form-action.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.web3forms.com https://formsubmit.co; form-action 'self' https://api.web3forms.com https://formsubmit.co; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
